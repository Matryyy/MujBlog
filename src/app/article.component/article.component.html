<article class="article-card">
    <div>
        <h3>{{ article().title }}</h3>
        @if (!adminMode()) {
            <p class="article-author">
                Autor: {{ article().author || 'Neznámý' }}
            </p>
        }
        <p class="article-preview">{{ (article().text || article().content) | preview:100 }}</p>
    </div>
    
    <div class="card-actions">
        @if (adminMode()) {
            <a href="/my-articles/{{ article().id }}" role="button" class="secondary">Zobrazit</a>
            <a href="/my-articles/edit/{{ article().id }}" role="button" class="contrast">Upravit</a>
            <app-button label="Smazat" type="danger" (btnClick)="onDelete()"></app-button>
        } @else {
            <a href="/public-articles/{{ article().id }}" role="button" class="outline">
              Zobrazit detail
            </a>
        }
    </div>
</article>
