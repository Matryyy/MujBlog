<div class="public-articles-container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2>Veřejné články</h2>
  </div>

  <div class="article-grid">
    @for (article of publicArticles(); track article.id) {
        <article class="article-card">
            <div>
                <h3>{{ article.title }}</h3>
                <p style="color: #697d73; font-size: 0.9rem; margin-bottom: 1rem; font-weight: 600;">
                  Autor: {{ article.author || 'Neznámý' }}
                </p>
                <p class="article-preview">{{ article.text | preview:100 }}</p>
            </div>
            
            <div class="card-actions" style="display: flex; gap: 10px; margin-top: 1.5rem;">
                <a [routerLink]="['/public-articles', article.id]" class="outline" style="flex: 1; text-align: center; line-height: 40px;">
                  Zobrazit detail
                </a>
            </div>
        </article>
    } @empty {
        <p class="loading-text">Načítání článků z internetu...</p>
    }
  </div>
</div>
